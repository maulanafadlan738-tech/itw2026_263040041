<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Background</title>
    <style>
        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: gray;
        }
        .frame {
            width: 400px;
            height: 400px;
            border: 10px solid white;
            margin: auto;
            background-image: url(img/images__3_-removebg-preview.png), url(img/images\ \(2\).jpg), url(img/images\ \(1\).jpg);
            background-repeat: no-repeat, no-repeat, no-repeat;
            background-size: 320px, 200px, 200px;
            background-position: center bottom, left, right;
            background-color: goldenrod;
            border-radius: 50%
        }
        h1 {
            color: white;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 40px;
            text-shadow: 2px 2px 4px black;
        }
    </style>
</head>
<body>
    <h1>My Profile Card</h1>
    <div class="frame"></div>
</body>
</html>
