<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Text - Text Overflow & Text Shadow</title>
    <style>
        p {
            font-size: 26px;
            white-space: nowrap;
            width: 300px;
            background-color: crimson;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        h1 {
            font-size: 100px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            text-shadow: 2px 2px 3px crimson, 0 -5px 0 pink;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: aqua;
            text-decoration-skip-ink: none;
        }
    </style>
</head>
<body>
    <h1>Hello, CSS!</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Neque dicta, aliquid nostrum aut exercitationem facere fuga rem deleniti vero, doloribus reiciendis tempora ipsum dolorum veniam iusto ducimus ipsa reprehenderit quasi!\</p>
</body>
</html>
