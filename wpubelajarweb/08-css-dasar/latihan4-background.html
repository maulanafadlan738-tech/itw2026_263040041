<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau dengan background</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: whitesmoke;
            background-image: linear-gradient(to bottom, rgb(15 23 43 / 90%) 60%, rgb(15 23 43 / 40%) ), url(img/images\ \(4\).jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
        h1 {
            font-size: 4em;
            text-transform: uppercase;
            text-align: center;
            font-style: italic;
            letter-spacing: 10px;
            /*text-shadow: 0 5px 5px lightblue;*/
            background-image: linear-gradient(to right, rgb(52, 52, 252), rgb(255, 0, 0));
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgb(52, 252, 145));
        }
        .quote {
            font-size: 22px;
            word-spacing: 5px;
            line-height: 2.2;
            text-align: center;
            background-color: rgb(255 255 255 / 5%);
            max-width: 600px;
            margin: auto;
            padding:40px ;
            border-radius: 20px;
            border: 1px solid rgb(255 255 255 / 10%) ;
            box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
        }
        .t {
            text-decoration: none;
            color: blue;
            text-shadow: 0 1px 0 rgb(34, 34, 181);
        }
        .credits {
            font-size: 12px;
            text-align: center;
            letter-spacing: 2px;
            color: pink;
            text-transform: uppercase;
            border-top: 1px solid rgb(255 255 255 / 20%);
            width: 30%;
            margin: 30px auto;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <h1>fase runtuh</h1>
    <div class="kotak"><P class="quote">"Tak perlu khawatir, ku hanya <span class="t">terluka</span>.
        <br>
         Terbiasa tuk pura-pura tertawa.
         <br>
          Namun Bolehkah sekali saja ku menangis?
          <br>
           sebelum kembali membohongi diri." </P>
           <br>
           </div>
    <p class="credits">- feby putri feat. fiersa besari</p>
</body>
</html>
