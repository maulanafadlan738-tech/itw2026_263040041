<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: crimson;
        }
        h1 {
            font-size: 48px;
            text-transform: uppercase;
            text-align: center;
            font-style: italic;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: black;
            text-decoration-skip-ink: none;
            letter-spacing: 10px;
            text-shadow: 0 5px 5px black;
        }
        .quote {
            font-size: 22px;
            word-spacing: 5px;
            line-height: 2.2;
            text-align: center;
        }
        .t {
            text-decoration: line-through;
            color: green;
        }
        .credits {
            font-size: 12px;
            text-align: center;
            letter-spacing: 2px;
            color: green;
        }
    </style>
</head>
<body>
    <h1>fase runtuh</h1>
    <P class="quote">"Tak perlu khawatir, ku hanya <span class="t">terluka</span>.
        <br>
         Terbiasa tuk pura-pura tertawa.
         <br>
          Namun Bolehkah sekali saja ku menangis?
          <br>
           sebelum kembali membohongi diri." </P>
           <br>
    <p class="credits">- feby putri feat. fiersa besari</p>
</body>
</html>
