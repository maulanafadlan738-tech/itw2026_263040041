<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select & Textarea</title>
</head>
<body>
    <h3>Pilih Kota:</h3>
<form>
    <select name="kota" id="kota">
        <option> --Pilih Kota--</option>
        <option value="bdg"> Bandung </option>
        <option value="jkt"> Jakarta </option>
        <option value="sby"> Surabaya </option>
        <option value="bli"> Bali </option>
        <option value="mlt"> Malut </option>
        <option value="mdn"> Medan </option>
        <option value="bgr"> Bogor </option>
    </select>
    <br>
    <h3>About Me:</h3>
    <textarea name="abot" id="about" required cols="50" rows="20" placeholder="Ceritakan diri anda"></textarea>
    <br><br>
    <button type="submit">Kirim!</button>
</form>

</body>
</html>
