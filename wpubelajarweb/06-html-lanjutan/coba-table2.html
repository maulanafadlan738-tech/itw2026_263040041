<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Complex Table</title>
</head>
<body>
    <h1>Latihan table</h1>
    <table>
        <thead>
            <th>Kolom 1</th>
            <th>Kolom 2</th>
        </thead>
        <tbody>
        <tr>
            <td>Baris 1, kolom 1</td>
            <td>Baris 1, kolom 2</td>
        </tr>
        <tr>
            <td>Baris 2, kolom 1</td>
            <td>Baris 2, kolom 2</td>
        </tr>
        </tbody>
    </table>
    <table border="1">
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Nim</th>
            <th>Prodi</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Fadlan Maulana</td>
            <td>263040041</td>
            <td>Teknik Informatika</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Fajri</td>
            <td>263040049</td>
            <td>Teknik Informatika</td>
        </tr>
    </table>
    
</body>
</html>
