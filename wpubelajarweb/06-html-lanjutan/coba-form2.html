<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Input, Checkbox & Radio</title>
</head>
<body>

    <h1>Contoh Input, Checkbox & Radio</h1>
    <form> 

        <label for="name">Nama:
            <input type="text" name="name" id="name"  placeholder="Masukkan Nama" autocomplete="off" autofocus required>
        </label>
        <br>
        <h3>Hobby:</h3>

            <label for="hobby1">
                <input type="checkbox" name="hobby1" id="hobby1" value="olahraga">Olahraga
            </label>
        <br>
            <label for="hobby2">
                <input type="checkbox" name="hobby2" id="hobby2" value="Ngoding">Ngoding
            </label>
        <br>
            <label for="hobby3">
                <input type="checkbox" name="hobby3" id="hobby3" value="menonton">Menonton
            </label>
        <br>
            <label for="hobby4">
                <input type="checkbox" name="hobby4" id="hobby4" value="music">Mendengarkan Music
            </label>
        <br>
        <h3>Jenis Kelamin:</h3>
        <label for="pria">
            <input type="radio" name="jenis_kelamin" id="pria" value="pria" checked>Pria
        </label>
        <br>
        <label for="wanita">
            <input type="radio" name="jenis_kelamin" id="wanita" value="wanita">Wanita
        </label>
        <br>
        <button type="submit">Kirim !</button>
        
        <br>




    </form>
    
</body>
</html>
