<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Elemen Form</title>
</head>

<body>
    <h1>Contoh elemen-elemen form pada HTML</h1>    
    
    <form>
    <label for="nama">Nama:
    <input type="text" name="nama" id="nama" placeholder="Masukkan Nama Anda">
    </label>

    <br>

    <label for="password">Password:</label>
    <input type="password" name="password" id="password" placeholder="Masukkan Password Anda">

    <br>

    <button>KIRIM!!</button>

    <br>

    <label for="email">Gmail:</label>
    <input type="email" name="email" id="email" placeholder="Masukkan Email Anda">

    <br>

    <label for="number">No. HP:</label>
    <input type="number" name="number" id="number" placeholder="Masukkan No. Hp Anda" min="0" max="10" step="2">
    <br>

    <label for="warna">Warna Kesukaan:</label>
    <input type="color" name="warna" id="warna" placeholder="Warna Kesukaan Anda">
    <br>

    <label for="tanggal">Tanggal:</label>
    <input type="date" name="tanggal" id="tanggal">

    </form>

</body>

</html>
